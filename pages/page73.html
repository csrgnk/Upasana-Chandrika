        <p style="text-align: center;"">రామాన్నాస్తి పరాయణం పరతరం రామస్య దాసోస్మ్యహం<P text align center>
<p style="text-align: center;">రామే చిత్తలయః సదా భవతు మే భో రామ మాముద్ధర<p style="text-align: center;">
<p style="text-align: center;"><strong>శ్రీరామ రామ రామేతి రమే రామే మనోరమే</strong>
<strong>సహస్రనామ తత్తుల్యం రామ నామ వరాననే</strong></p>
<p style="text-align: center;"><strong>ఇతి శ్రీబుధకౌశికముని విరచితం శ్రీరామ రక్షాస్తోత్రం సంపూర్ణం </strong></p text algn center>
