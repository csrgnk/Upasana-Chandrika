
<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title id="meta-title">उपासना चंद्रिका - नमो नारायणाय</title>
    <meta name="description" content="नमो नारायणाय भक्ती चॅनेलवरून उपासना चंद्रिका भक्तीचे साहित्य वाचा.">
    <meta name="author" content="Sangameshwar">
    
    <link rel="icon" type="image/png" href="https://omnnbc.com/assets/images/Omnnbc-new.png">
    <link rel="apple-touch-icon" href="https://omnnbc.com/assets/images/Omnnbc-new.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background-color: #F4F7F6;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
        }

        /* ===== 1. Top Navigation ===== */
        .top-nav-container {
            background-color: #C2185B;
            width: 100%;
            padding: 12px 15px;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            justify-content: flex-start;
        }
        /* Center navigation links on desktop screens */
        @media (min-width: 768px) {
            .top-nav-container {
                justify-content: center;
            }
        }
        .top-nav-container::-webkit-scrollbar { display: none; }

        .top-nav-container a {
            text-decoration: none;
            color: #C2185B;
            background-color: white;
            font-weight: bold;
            padding: 8px 18px;
            margin: 0 6px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }
        .top-nav-container a:hover {
            background-color: #FFFDE7;
        }

        /* ===== Header Section ===== */
        .header-container {
            background-color: #FFFDE7;
            padding: 20px 10px;
            border-bottom: 4px solid #FFD600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .header-logo { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #C2185B; }
        .site-title-main { color: #C2185B; font-size: 22px; text-align: left; line-height: 1.1; }

        /* ===== Pagination Bar ===== */
        .page-nav-section {
            width: 100%;
            background: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .book-name-badge {
            background-color: #C2185B;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .scroll-controls { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 800px; padding: 0 10px; }
        .numbers-wrapper { display: flex; overflow-x: auto; gap: 8px; padding: 10px 5px; max-width: 80%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .numbers-wrapper::-webkit-scrollbar { display: none; }
        
        .numbers-wrapper a { 
            text-decoration: none; 
            color: #C2185B; 
            border: 1px solid #C2185B; 
            padding: 8px 15px; 
            border-radius: 4px; 
            flex-shrink: 0; 
            font-weight: bold; 
            transition: all 0.2s;
        }
        .numbers-wrapper a.active { background-color: #C2185B; color: white; }
        .numbers-wrapper a:hover:not(.active) { background-color: #FFFDE7; }
        
        .scroll-btn { 
            background-color: #C2185B; 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 50%; 
            cursor: pointer; 
            font-weight: bold; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* ===== Main Content Card ===== */
        .main-content-card {
            width: 92%; 
            max-width: 800px; 
            margin: 40px auto;
            background-color: #FFFDE7;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge-pos { display: flex; justify-content: center; margin-top: -60px; margin-bottom: 25px; }
        .round-badge { background-color: #C2185B; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #F4F7F6; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.16); }

        /* Global Typography for Dynamic Content */
        .page-text-content { 
            font-size: 20px; 
            color: #3E2723; 
            line-height: 1.8; 
            width: 100%; 
            text-align: center; 
            white-space: pre-line; 
            word-wrap: break-word;
            padding: 10px 0;
        }
        /* Desktop text sizing adjustments */
        @media (min-width: 768px) {
            .page-text-content { font-size: 24px; line-height: 2.0; }
        }
        .page-text-content h1, .page-text-content h2, .page-text-content h3 { color: #C2185B !important; font-weight: bold !important; margin-bottom: 15px; }

        /* ===== Fallback State Style ===== */
        .coming-soon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 10px;
            color: #5d4037;
        }
        .coming-soon-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .bottom-nav { display: flex; justify-content: center; gap: 20px; padding-top: 30px; }
        .nav-btn { 
            background-color: #C2185B; 
            color: white; 
            text-decoration: none; 
            padding: 12px 30px; 
            border-radius: 25px; 
            font-weight: bold; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        .nav-btn:hover { background-color: #d81b60; }
        
        .footer { background-color: #0D1B3D; color: white; text-align: center; padding: 30px; width: 100%; margin-top: auto; font-size: 14px; }
    </style>
</head>

<body>

<nav class="top-nav-container">
    <a href="./">Home</a>
    <a href="https://omnnbc.com">Main Site</a>
    <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
    <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok</a>
</nav>

<header class="header-container">
    <img src="https://omnnbc.com/assets/images/Omnnbc-new.png" class="header-logo" alt="Logo">
    <h1 class="site-title-main">
        <span style="font-weight:bold;">नमो नारायणाय</span><br>
        <span style="font-size:18px; font-weight:normal;">भक्ती चॅनेल</span>
    </h1>
</header>

<div class="page-nav-section">
    <div class="book-name-badge">श्री उपासना चंद्रिका</div>
    <div class="scroll-controls">
        <button class="scroll-btn" onclick="sideScroll(-150)">&#10094;</button>
        <div class="numbers-wrapper" id="pagination"></div>
        <button class="scroll-btn" onclick="sideScroll(150)">&#10095;</button>
    </div>
</div>

<main class="main-content-card">
    <div>
        <div class="badge-pos">
            <div class="round-badge" id="current-badge">1</div>
        </div>
        <div id="content" class="page-text-content">लॉड होत आहे...</div>
    </div>
    <div class="bottom-nav" id="bottom-nav"></div>
</main>

<footer class="footer">
    © 2026 Namo Narayanaya Bhakthi Channel | All Rights Reserved
</footer>

<script>
const totalPages = 143;
const paginationDiv = document.getElementById("pagination");
const contentDiv = document.getElementById("content");
const badge = document.getElementById("current-badge");
const btmNav = document.getElementById("bottom-nav");

let urlParams = new URLSearchParams(window.location.search);
let page = urlParams.get("page");

function loadPage(p) {
    const pNum = p ? parseInt(p) : 1; 
    badge.innerText = pNum;
    document.title = "Page " + pNum + " | Upasana Chandrika";
    
    fetch("pages/page" + pNum + ".html")
        .then(res => {
            if (!res.ok) {
                throw new Error("Page not found");
            }
            return res.text();
        })
        .then(data => { 
            contentDiv.innerHTML = data; 
            updateNav(pNum); 
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        })
        .catch(() => { 
            // Graceful mobile-friendly fallback if the page HTML file is missing
            contentDiv.innerHTML = `
                <div class="coming-soon-container">
                    <div class="coming-soon-icon">📖</div>
                    <h3 style="margin-bottom: 8px;">सामग्री लवकरच येत आहे</h3>
                    <p style="color:#777; font-size: 16px;">पान क्र. ${pNum} अद्याप उपलब्ध नाही. कृपया लवकरच पुन्हा प्रयत्न करा (Coming Soon)...</p>
                </div>
            `; 
            updateNav(pNum); 
        });
}

// Build standard numeric navigation pagination
for (let i = 1; i <= totalPages; i++) {
    const a = document.createElement("a");
    a.href = "?page=" + i;
    a.innerText = i;
    if (page === i.toString() || (!page && i === 1)) a.className = "active"; 
    paginationDiv.appendChild(a);
}

function updateNav(curr) {
    btmNav.innerHTML = `
        ${curr > 1 ? `<a href="?page=${curr - 1}" class="nav-btn">मागे (Prev)</a>` : ''}
        ${curr < totalPages ? `<a href="?page=${curr + 1}" class="nav-btn">पुढे (Next)</a>` : ''}
    `;
}

function sideScroll(d) { paginationDiv.scrollBy({ left: d, behavior: 'smooth' }); }

document.addEventListener("DOMContentLoaded", () => {
    loadPage(page);
    setTimeout(() => {
        const act = document.querySelector(".active");
        if (act) act.scrollIntoView({ behavior: "smooth", inline: "center" });
    }, 500);
});
</script>
</body>
</html>
