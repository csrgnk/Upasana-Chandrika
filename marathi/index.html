<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, shrink-to-fit=no">
    
    <title id="meta-title">उपासना चंद्रिका - नमो नारायणाय</title>
    <meta name="description" content="नमो नारायणाय भक्ती चॅनेलवरून उपासना चंद्रिका भक्तीचे साहित्य वाचा.">
    <meta name="author" content="Sangameshwar">
    
    <link rel="icon" type="image/png" href="https://omnnbc.com/assets/images/Omnnbc-new.png">
    <link rel="apple-touch-icon" href="https://omnnbc.com/assets/images/Omnnbc-new.png">

    <style>
        /* Modern Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #F4F7F6;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; 
            -webkit-text-size-adjust: 100%; /* Prevents iOS font resizing */
            overflow-x: hidden;
        }

        /* ===== 1. Top Navigation ===== */
        .top-nav-container {
            background-color: #C2185B;
            width: 100%;
            padding: 12px 10px;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
            scrollbar-width: none;
            justify-content: flex-start;
        }
        .top-nav-container::-webkit-scrollbar { display: none; }

        .top-nav-container a {
            text-decoration: none;
            color: #C2185B;
            background-color: white;
            font-weight: bold;
            padding: 8px 16px;
            margin-right: 10px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ===== Header Section ===== */
        .header-container {
            background-color: #FFFDE7;
            padding: 20px 15px;
            border-bottom: 4px solid #FFD600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .header-logo { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #C2185B; object-fit: cover; }
        .site-title-main { color: #C2185B; font-size: 22px; text-align: left; line-height: 1.2; }

        /* ===== Pagination Bar ===== */
        .page-nav-section {
            width: 100%;
            background: white;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .book-name-badge {
            background-color: #C2185B;
            color: white;
            padding: 8px 25px;
            border-radius: 30px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
        }
        .scroll-controls { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
            max-width: 500px; /* Constraints pagination on larger screens */
        }
        .numbers-wrapper { 
            display: flex; 
            overflow-x: auto; 
            gap: 8px; 
            padding: 5px 10px; 
            flex-grow: 1;
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch;
        }
        .numbers-wrapper::-webkit-scrollbar { display: none; }
        
        .numbers-wrapper a { 
            text-decoration: none; 
            color: #C2185B; 
            border: 1px solid #C2185B; 
            padding: 8px 14px; 
            border-radius: 4px; 
            flex-shrink: 0; 
            font-weight: bold; 
            font-size: 14px;
            min-width: 40px;
            text-align: center;
        }
        .numbers-wrapper a.active { background-color: #C2185B; color: white; }
        
        .scroll-btn { 
            background-color: #C2185B; 
            color: white; 
            border: none; 
            padding: 10px 14px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== Main Content Card ===== */
        .main-content-card {
            width: 92%; 
            max-width: 800px; 
            margin: 40px auto;
            background-color: #FFFDE7;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            min-height: 300px; /* Reduced for better small-device handling if content fails to load */
            box-sizing: border-box;
        }
        .badge-pos { display: flex; justify-content: center; margin-top: -50px; margin-bottom: 20px; }
        .round-badge { background-color: #C2185B; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #F4F7F6; font-weight: bold; font-size: 16px; }

        /* Typography for Dynamic Content */
        .page-text-content { 
            font-size: 20px; /* Slightly adjusted for standard readability on smaller phones */
            color: #3E2723; 
            line-height: 1.8; 
            width: 100%; 
            text-align: center; 
            white-space: pre-line;
            word-wrap: break-word; /* Ensures text doesn't spill out */
        }
        .page-text-content h1, .page-text-content h2, .page-text-content h3 { color: #C2185B !important; font-weight: bold !important; margin-bottom: 15px; }

        .bottom-nav { display: flex; justify-content: center; gap: 15px; padding-top: 25px; width: 100%; }
        .nav-btn { background-color: #C2185B; color: white; text-decoration: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-size: 16px; flex: 1; max-width: 160px; text-align: center; }
        
        .footer { background-color: #0D1B3D; color: white; text-align: center; padding: 25px 15px; width: 100%; margin-top: auto; font-size: 14px; }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .site-title-main { font-size: 18px; }
            .site-title-main span { font-size: 14px !important; }
            .header-logo { width: 50px; height: 50px; }
            .page-text-content { font-size: 18px; line-height: 1.7; }
            .main-content-card { margin: 35px auto 25px auto; padding: 15px; }
        }
    </style>
</head>

<body>

<nav class="top-nav-container">
    <a href="./">Home</a>
    <a href="https://omnnbc.com">Main Site</a>
    <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
    <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok</a>
</nav>

<header class="header-container">
    <img src="https://omnnbc.com/assets/images/Omnnbc-new.png" class="header-logo" alt="Logo">
    <h1 class="site-title-main">
        <span style="font-weight:bold;">नमो नारायणाय</span><br>
        <span style="font-size:18px; font-weight:normal;">भक्ती चॅनेल</span>
    </h1>
</header>

<div class="page-nav-section">
    <div class="book-name-badge">श्री उपासना चंद्रिका</div>
    <div class="scroll-controls">
        <button class="scroll-btn" onclick="sideScroll(-150)">&#10094;</button>
        <div class="numbers-wrapper" id="pagination"></div>
        <button class="scroll-btn" onclick="sideScroll(150)">&#10095;</button>
    </div>
</div>

<main class="main-content-card">
    <div class="badge-pos">
        <div class="round-badge" id="current-badge">1</div>
    </div>
    <div id="content" class="page-text-content">सामग्री लोड होत आहे... (Loading...)</div>
    <div class="bottom-nav" id="bottom-nav"></div>
</main>

<footer class="footer">
    © 2026 Namo Narayanaya Bhakthi Channel | All Rights Reserved
</footer>

<script>
const totalPages = 143;
const paginationDiv = document.getElementById("pagination");
const contentDiv = document.getElementById("content");
const badge = document.getElementById("current-badge");
const btmNav = document.getElementById("bottom-nav");

let urlParams = new URLSearchParams(window.location.search);
let page = urlParams.get("page");

function loadPage(p) {
    const pNum = p ? parseInt(p) : 1; 
    badge.innerText = pNum;
    document.title = "Page " + pNum + " | Upasana Chandrika";
    
    fetch("pages/page" + pNum + ".html")
        .then(res => {
            if(!res.ok) throw new Error('Not Found');
            return res.text();
        })
        .then(data => { 
            contentDiv.innerHTML = data; 
            updateNav(pNum); 
            window.scrollTo({top: 0, behavior: 'smooth'}); 
        })
        .catch(() => { 
            // Graceful fallback UI for incomplete or missing pages
            contentDiv.innerHTML = "<p style='color:#777; padding:40px 10px; font-weight: bold;'>सामग्री लवकरच येत आहे<br><span style='font-size:16px; font-weight:normal; display:block; margin-top:5px;'>(Coming Soon)...</span></p>"; 
            updateNav(pNum); 
        });
}

// Generate pagination
for (let i = 1; i <= totalPages; i++) {
    const a = document.createElement("a");
    a.href = "?page=" + i;
    a.innerText = i;
    if (page === i.toString() || (!page && i === 1)) a.className = "active"; 
    paginationDiv.appendChild(a);
}

function updateNav(curr) {
    btmNav.innerHTML = `
        ${curr > 1 ? `<a href="?page=${curr - 1}" class="nav-btn">मागे (Prev)</a>` : ''}
        ${curr < totalPages ? `<a href="?page=${curr + 1}" class="nav-btn">पुढे (Next)</a>` : ''}
    `;
}

function sideScroll(d) { paginationDiv.scrollBy({ left: d, behavior: 'smooth' }); }

document.addEventListener("DOMContentLoaded", () => {
    loadPage(page);
    setTimeout(() => {
        const act = document.querySelector(".active");
        if (act) act.scrollIntoView({ behavior: "smooth", inline: "center" });
    }, 300);
});
</script>
</body>
</html>
