<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upasana Chandrika</title>

<script type="text/javascript">
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 123 || e.keyCode === 73)) return false;
        if (e.keyCode === 123) return false;
    };
    document.onselectstart = function() { return false; };
</script>

<style>
/* ===== Global Centering Fix ===== */
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden; /* Stops horizontal scrolling */
    font-family: Arial, sans-serif;
    background-color: #F4F7F6;
    text-align: center; /* Centers all inline text */
}

/* ===== Top Pink Navigation ===== */
.top-header-nav {
    background-color: #C2185B;
    padding: 12px 0;
    overflow-x: auto;
    white-space: nowrap;
    display: block; /* Changed from flex for better centering */
    scrollbar-width: none;
}
.top-header-nav::-webkit-scrollbar { display: none; }

.nav-links-container {
    display: inline-flex; /* Ensures it stays centered if links are few */
    gap: 12px;
    padding: 0 15px;
}

.nav-links-container a {
    text-decoration: none;
    color: #C2185B;
    background-color: white;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 5px;
}

/* ===== Title Box Centering ===== */
.site-title-box {
    background-color: #FFFDE7;
    padding: 30px 15px;
    border-bottom: 4px solid #FFD600;
    width: 100%;
}
.site-title-box h1 {
    color: #C2185B;
    margin: 0 auto;
    font-size: 24px;
    max-width: 90%;
}

/* ===== Navigation Section Centering ===== */
.page-nav-section {
    display: flex;
    flex-direction: column;
    align-items: center; /* Centers items vertically */
    justify-content: center; /* Centers items horizontally */
    gap: 12px;
    padding: 20px 0;
    background: white;
    width: 100%;
}

.book-name-badge {
    background-color: #C2185B;
    color: white;
    padding: 10px 25px;
    border-radius: 30px;
    font-weight: bold;
    display: inline-block;
}

.scroll-controls {
    display: flex;
    align-items: center;
    justify-content: center; /* This is the key for centering numbers */
    width: 100%;
    max-width: 100vw;
}

.numbers-wrapper {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    gap: 8px;
    padding: 10px 5px;
    max-width: 70%; 
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.numbers-wrapper::-webkit-scrollbar { display: none; }

.numbers-wrapper a {
    text-decoration: none;
    color: #C2185B;
    font-weight: bold;
    border: 1px solid #C2185B;
    padding: 7px 15px;
    border-radius: 4px;
    flex-shrink: 0;
}
.numbers-wrapper a.active { background-color: #C2185B; color: white; }

.scroll-btn {
    background-color: #C2185B;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
}

/* ===== Content Card Centering (The Main Fix) ===== */
.main-content-card {
    width: 90%; 
    max-width: 850px; 
    margin: 50px auto; /* 'auto' centers the card horizontally */
    background-color: #FFFDE7;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    position: relative;
    left: 0;
    right: 0;
}

.badge-pos {
    display: flex;
    justify-content: center;
    margin-top: -50px;
    margin-bottom: 20px;
}
.round-badge {
    background-color: #C2185B;
    color: white;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border: 4px solid #F4F7F6;
}

.page-text-content { 
    text-align: center;
    word-wrap: break-word;
}

/* Footer Centering */
.footer {
    background-color: #0D1B3D;
    color: white;
    padding: 30px;
    margin-top: 50px;
    width: 100%;
}

/* Bottom Buttons Centering */
.bottom-nav {
    display: flex;
    justify-content: center; /* Centers Prev/Next buttons */
    gap: 20px;
    padding: 20px 0;
}
.nav-btn {
    background-color: #C2185B;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 14px;
    min-width: 100px;
}
</style>
</head>

<body>

<nav class="top-header-nav">
  <div class="nav-links-container">
    <a href="/Upasana-Chandrika/">Home</a>
    <a href="/Omnnbc/">Main Site</a>
    <a href="/Dasabodha/">Dasabodha</a>
    <a href="/manache-shlok/">Manache Shlok Telugu</a>
    <a href="/manache-shlok/hindi/">Manache Shlok Hindi</a>
  </div>
</nav>

<div class="site-title-box">
  <h1>Namo Narayanaya Bhakthi Channel</h1>
</div>

<div class="page-nav-section">
  <div class="book-name-badge">Upasana Chandrika</div>
  <div class="scroll-controls">
    <button class="scroll-btn" onclick="sideScroll(-150)">&#10094;</button>
    <div class="numbers-wrapper" id="pagination"></div>
    <button class="scroll-btn" onclick="sideScroll(150)">&#10095;</button>
  </div>
</div>

<main class="main-content-card">
  <div class="badge-pos">
    <div class="round-badge" id="current-page">1</div>
  </div>
  <div id="content" class="page-text-content">Loading...</div>
  <div class="bottom-nav" id="bottom-nav"></div>
</main>

<footer class="footer">
  © 2026 Namo Narayanaya Bhakthi Channel | All Rights Reserved
</footer>

<script>
const totalPages = 143;
const paginationDiv = document.getElementById("pagination");
const contentDiv = document.getElementById("content");
const pageBadge = document.getElementById("current-page");
const btmNav = document.getElementById("bottom-nav");

let page = new URLSearchParams(window.location.search).get("page") || 1;
page = parseInt(page);

function loadPage(p) {
  pageBadge.innerText = p;
  fetch("pages/page" + p + ".html")
    .then(res => res.text())
    .then(data => { contentDiv.innerHTML = data; updateButtons(); })
    .catch(() => {
      contentDiv.innerHTML = "<div><h2>Coming Soon</h2></div>";
      updateButtons();
    });
}

for (let i = 1; i <= totalPages; i++) {
  const a = document.createElement("a");
  a.href = "?page=" + i;
  a.innerText = i;
  if (i === page) a.className = "active";
  paginationDiv.appendChild(a);
}

function sideScroll(d) { paginationDiv.scrollBy({ left: d, behavior: 'smooth' }); }

function updateButtons() {
  btmNav.innerHTML = `
    ${page > 1 ? `<a href="?page=${page-1}" class="nav-btn">Previous</a>` : ''}
    ${page < totalPages ? `<a href="?page=${page+1}" class="nav-btn">Next</a>` : ''}
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  loadPage(page);
  setTimeout(() => {
      const active = document.querySelector(".active");
      if (active) active.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }, 500);
});
</script>

</body>
</html>
