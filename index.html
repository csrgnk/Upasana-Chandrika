<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upasana Chandrika</title>

<script type="text/javascript">
    // Disable Right-Click
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Disable Shortcuts
    document.onkeydown = function(e) {
        if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 123 || e.keyCode === 73)) {
            return false;
        }
        if (e.keyCode === 123) return false;
    };

    // Disable Text Selection
    document.onselectstart = function() { return false; };
</script>

<style>
/* ===== Global Reset & Fix for Horizontal Scroll ===== */
* { 
    box-sizing: border-box; 
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden; /* Prevents long right-side horizontal scrolling */
    font-family: Arial, sans-serif;
    background-color: #F4F7F6;
    color: #333;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

/* Disable Image dragging */
img {
    pointer-events: none;
    -webkit-user-drag: none;
}

/* ===== Top Pink Navigation ===== */
.top-header-nav {
    background-color: #C2185B;
    padding: 12px 0;
    overflow-x: auto;
    white-space: nowrap;
    display: flex;
    scrollbar-width: none;
}
.top-header-nav::-webkit-scrollbar { display: none; }

.nav-links-container {
    display: flex;
    gap: 12px;
    padding: 0 15px;
}

.nav-links-container a {
    text-decoration: none;
    color: #C2185B;
    background-color: white;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 5px;
}

/* ===== Channel Name Section ===== */
.site-title-box {
    background-color: #FFFDE7;
    padding: 30px 10px;
    text-align: center;
    border-bottom: 4px solid #FFD600;
}

.site-title-box h1 {
    color: #C2185B;
    margin: 0;
    font-size: 24px;
    line-height: 1.3;
}

/* ===== Page Navigation Section ===== */
.page-nav-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 0;
    background: white;
}

.book-name-badge {
    background-color: #C2185B;
    color: white;
    padding: 10px 25px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.scroll-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 100vw;
}

.scroll-btn {
    background-color: #C2185B;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 14px;
    cursor: pointer;
    flex-shrink: 0;
}

/* Fixed Pagination Container */
.numbers-wrapper {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    gap: 8px;
    padding: 10px 5px;
    max-width: 70%; /* Keeps it from hitting the edges */
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.numbers-wrapper::-webkit-scrollbar { display: none; }

.numbers-wrapper a {
    text-decoration: none;
    color: #C2185B;
    font-weight: bold;
    border: 1px solid #C2185B;
    padding: 7px 15px;
    border-radius: 4px;
    font-size: 14px;
    flex-shrink: 0; /* Important: keeps buttons from squishing */
}

.numbers-wrapper a.active {
    background-color: #C2185B;
    color: white;
}

/* ===== Main Content Card (Responsive Fix) ===== */
.main-content-card {
    width: 92%; /* Takes up most of the screen on mobile */
    max-width: 850px; /* Limits size on desktop */
    margin: 50px auto;
    background-color: #FFFDE7;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    min-height: 350px;
    position: relative;
    word-wrap: break-word; /* Prevents long text from breaking layout */
}

.badge-pos {
    display: flex;
    justify-content: center;
    margin-top: -55px;
    margin-bottom: 25px;
}
.round-badge {
    background-color: #C2185B;
    color: white;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border: 4px solid #F4F7F6;
}

.page-text-content { 
    font-size: 18px; /* Slightly adjusted for mobile readability */
    text-align: center;
    color: #5C2E00;
}

.page-text-content h2, 
.page-text-content h3 {
    color: #C2185B; 
    font-size: 24px;
    margin: 20px 0;
}

/* Coming Soon Style */
.coming-soon-container {
    background-color: #C2185B;
    color: white;
    padding: 40px 15px;
    border-radius: 12px;
    text-align: center;
    width: 100%;
}
.coming-soon-container h2 { color: white !important; }

/* ===== Nav Buttons ===== */
.bottom-nav {
    display: flex;
    justify-content: space-between;
    padding: 20px 0;
    gap: 10px;
}
.nav-btn {
    background-color: #C2185B;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 25px;
    font-weight: bold;
    font-size: 14px;
    text-align: center;
    flex: 1; /* Makes buttons equal size on small screens */
    max-width: 150px;
}

/* ===== Footer ===== */
.footer {
    background-color: #0D1B3D;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 50px;
    width: 100%;
}
</style>
</head>

<body>

<nav class="top-header-nav">
  <div class="nav-links-container">
    <a href="/Upasana-Chandrika/">Home</a>
    <a href="/Omnnbc/">Main Site</a>
    <a href="/Dasabodha/">Dasabodha</a>
    <a href="/manache-shlok/">Manache Shlok Telugu</a>
    <a href="/manache-shlok/hindi/">Manache Shlok Hindi</a>
  </div>
</nav>

<div class="site-title-box">
  <h1>Namo Narayanaya<br>Bhakthi Channel</h1>
</div>

<div class="page-nav-section">
  <div class="book-name-badge">Upasana Chandrika</div>
  <div class="scroll-controls">
    <button class="scroll-btn" onclick="sideScroll(-150)">&#10094;</button>
    <div class="numbers-wrapper" id="pagination"></div>
    <button class="scroll-btn" onclick="sideScroll(150)">&#10095;</button>
  </div>
</div>

<main class="main-content-card">
  <div class="badge-pos">
    <div class="round-badge" id="current-page">1</div>
  </div>
  
  <div id="content" class="page-text-content">Loading Content...</div>

  <div class="bottom-nav" id="bottom-nav"></div>
</main>

<footer class="footer">
  © 2026 Namo Narayanaya Bhakthi Channel | All Rights Reserved
</footer>

<script>
const totalPages = 143;
const contentDiv = document.getElementById("content");
const paginationDiv = document.getElementById("pagination");
const pageBadge = document.getElementById("current-page");
const btmNav = document.getElementById("bottom-nav");

let page = new URLSearchParams(window.location.search).get("page") || 1;
page = parseInt(page);

function loadPage(p) {
  pageBadge.innerText = p;
  fetch("pages/page" + p + ".html")
    .then(res => { if (!res.ok) throw new Error(); return res.text(); })
    .then(data => { contentDiv.innerHTML = data; updateButtons(); })
    .catch(() => {
      contentDiv.innerHTML = `
        <div class="coming-soon-container">
          <h2>Coming Soon</h2>
          <p>This content is being prepared.</p>
        </div>`;
      updateButtons();
    });
}

// Generate Pagination
for (let i = 1; i <= totalPages; i++) {
  const a = document.createElement("a");
  a.href = "?page=" + i;
  a.innerText = i;
  if (i === page) a.className = "active";
  paginationDiv.appendChild(a);
}

function sideScroll(d) { 
    paginationDiv.scrollBy({ left: d, behavior: 'smooth' }); 
}

function updateButtons() {
  btmNav.innerHTML = `
    ${page > 1 ? `<a href="?page=${page-1}" class="nav-btn">Previous</a>` : '<div></div>'}
    ${page < totalPages ? `<a href="?page=${page+1}" class="nav-btn">Next</a>` : '<div></div>'}
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  loadPage(page);
  // Center the active page number in the scroll view
  setTimeout(() => {
      const active = document.querySelector(".active");
      if (active) active.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }, 300);
});
</script>

</body>
</html>
