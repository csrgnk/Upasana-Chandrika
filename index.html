<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upasana Chandrika</title>

<script type="text/javascript">
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 123 || e.keyCode === 73)) return false;
        if (e.keyCode === 123) return false;
    };
    document.onselectstart = function() { return false; };
</script>

<style>
/* ===== 1. CRITICAL OVERFLOW FIXES ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100vw; /* Forces width to match phone screen */
  overflow-x: hidden; /* Stops the right-side scrolling problem */
  font-family: Arial, sans-serif;
  background-color: #F4F7F6;
}

* { box-sizing: border-box; }

/* ===== Top Navigation ===== */
.top-header-nav {
  background-color: #C2185B;
  padding: 12px 0;
  overflow-x: auto;
  white-space: nowrap;
  display: flex;
  scrollbar-width: none;
}
.top-header-nav::-webkit-scrollbar { display: none; }
.nav-links-container { display: flex; gap: 10px; padding: 0 15px; }
.nav-links-container a {
  text-decoration: none;
  color: #C2185B;
  background-color: white;
  font-weight: bold;
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 5px;
}

/* ===== Title Section ===== */
.site-title-box {
  background-color: #FFFDE7;
  padding: 20px 10px;
  text-align: center;
  border-bottom: 4px solid #FFD600;
}
.site-title-box h1 { color: #C2185B; margin: 0; font-size: 22px; }

/* ===== Pagination Section ===== */
.page-nav-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 15px 0;
  background: white;
}
.book-name-badge {
  background-color: #C2185B;
  color: white;
  padding: 8px 20px;
  border-radius: 30px;
  font-weight: bold;
  font-size: 15px;
}
.scroll-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.scroll-btn {
  background-color: #C2185B;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 8px 12px;
  cursor: pointer;
}
.numbers-wrapper {
  display: flex;
  overflow-x: auto;
  white-space: nowrap;
  gap: 6px;
  padding: 5px;
  max-width: 65%;
  scrollbar-width: none;
}
.numbers-wrapper::-webkit-scrollbar { display: none; }
.numbers-wrapper a {
  text-decoration: none;
  color: #C2185B;
  font-weight: bold;
  border: 1px solid #C2185B;
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 14px;
  flex-shrink: 0;
}
.numbers-wrapper a.active { background-color: #C2185B; color: white; }

/* ===== 2. CONTENT CARD FIX ===== */
.main-content-card {
  width: 95%; /* Responsive width */
  max-width: 850px; /* PC limit */
  margin: 40px auto;
  background-color: #FFFDE7;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  min-height: 300px;
  position: relative;
  word-wrap: break-word; /* Prevents long words from pushing the card wide */
}

.badge-pos {
  display: flex;
  justify-content: center;
  margin-top: -45px;
  margin-bottom: 20px;
}
.round-badge {
  background-color: #C2185B;
  color: white;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  border: 3px solid #F4F7F6;
}

.page-text-content { 
  font-size: 18px; 
  text-align: center;
  color: #5C2E00;
}

/* Coming Soon Box */
.coming-soon-container {
  background-color: #C2185B;
  color: white;
  padding: 30px 15px;
  border-radius: 10px;
}

/* ===== Footer Fix ===== */
.footer {
  background-color: #0D1B3D;
  color: white;
  text-align: center;
  padding: 25px 15px;
  width: 100%;
  margin-top: 30px;
}

.bottom-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  gap: 10px;
}
.nav-btn {
  background-color: #C2185B;
  color: white;
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
  flex: 1;
  text-align: center;
}
</style>
</head>
<body>

<nav class="top-header-nav">
  <div class="nav-links-container">
    <a href="/Upasana-Chandrika/">Home</a>
    <a href="/Omnnbc/">Main Site</a>
    <a href="/Dasabodha/">Dasabodha</a>
    <a href="/manache-shlok/">Manache Shlok Telugu</a>
    <a href="/manache-shlok/hindi/">Manache Shlok Hindi</a>
  </div>
</nav>

<div class="site-title-box">
  <h1>Namo Narayanaya<br>Bhakthi Channel</h1>
</div>

<div class="page-nav-section">
  <div class="book-name-badge">Upasana Chandrika</div>
  <div class="scroll-controls">
    <button class="scroll-btn" onclick="sideScroll(-100)">&#10094;</button>
    <div class="numbers-wrapper" id="pagination"></div>
    <button class="scroll-btn" onclick="sideScroll(100)">&#10095;</button>
  </div>
</div>

<main class="main-content-card">
  <div class="badge-pos">
    <div class="round-badge" id="current-page">1</div>
  </div>
  <div id="content" class="page-text-content">Loading Content...</div>
  <div class="bottom-nav" id="bottom-nav"></div>
</main>

<footer class="footer">
  © 2026 Namo Narayanaya Bhakthi Channel | All Rights Reserved
</footer>

<script>
const totalPages = 143;
const paginationDiv = document.getElementById("pagination");
const pageBadge = document.getElementById("current-page");
const btmNav = document.getElementById("bottom-nav");
const contentDiv = document.getElementById("content");

let page = new URLSearchParams(window.location.search).get("page") || 1;
page = parseInt(page);

function loadPage(p) {
  pageBadge.innerText = p;
  fetch("pages/page" + p + ".html")
    .then(res => { if (!res.ok) throw new Error(); return res.text(); })
    .then(data => { contentDiv.innerHTML = data; updateButtons(); })
    .catch(() => {
      contentDiv.innerHTML = `<div class="coming-soon-container"><h2>Coming Soon</h2><p>Prepared soon.</p></div>`;
      updateButtons();
    });
}

for (let i = 1; i <= totalPages; i++) {
  const a = document.createElement("a");
  a.href = "?page=" + i;
  a.innerText = i;
  if (i === page) a.className = "active";
  paginationDiv.appendChild(a);
}

function sideScroll(d) { paginationDiv.scrollBy({ left: d, behavior: 'smooth' }); }

function updateButtons() {
  btmNav.innerHTML = `
    ${page > 1 ? `<a href="?page=${page-1}" class="nav-btn">Previous</a>` : '<div></div>'}
    ${page < totalPages ? `<a href="?page=${page+1}" class="nav-btn">Next</a>` : '<div></div>'}
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  loadPage(page);
  setTimeout(() => {
    const active = document.querySelector(".active");
    if (active) active.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }, 200);
});
</script>
</body>
</html>
