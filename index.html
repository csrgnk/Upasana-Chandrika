<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title id="meta-title">Upasana Chandrika - Namo Narayanaya</title>
    <meta name="description" content="Read Upasana Chandrika devotional content, chapters, and stotrams.">
    
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    
    <link rel="canonical" href="https://upasana-chandrika.omnnbc.in/" />

    <style>
        /* [Your existing styles stay here - No changes needed in CSS] */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background-color: #F4F7F6;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }
        .top-nav-container {
            background-color: #C2185B;
            width: 100%;
            padding: 12px 0;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            justify-content: flex-start;
            -webkit-overflow-scrolling: touch;
        }
        .top-nav-container a {
            display: inline-block;
            text-decoration: none;
            color: #C2185B;
            background-color: white;
            font-weight: bold;
            padding: 8px 18px;
            margin: 0 6px;
            border-radius: 5px;
            font-size: 14px;
        }
        .site-title-box { background-color: #FFFDE7; padding: 25px 10px; border-bottom: 4px solid #FFD600; width: 100%; text-align: center; }
        .site-title-box h1 { color: #C2185B; font-size: 24px; margin: 0; }
        .page-nav-section { width: 100%; background: white; padding: 20px 0; display: flex; flex-direction: column; align-items: center; }
        .book-name-badge { background-color: #C2185B; color: white; padding: 10px 25px; border-radius: 30px; margin-bottom: 15px; font-weight: bold; }
        .scroll-controls { display: flex; align-items: center; justify-content: center; width: 100%; }
        .numbers-wrapper { display: flex; overflow-x: auto; gap: 8px; padding: 10px; max-width: 70%; scrollbar-width: none; }
        .numbers-wrapper a { text-decoration: none; color: #C2185B; border: 1px solid #C2185B; padding: 8px 15px; border-radius: 4px; flex-shrink: 0; font-weight: bold; }
        .numbers-wrapper a.active { background-color: #C2185B; color: white; }
        .scroll-btn { background-color: #C2185B; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .main-content-card { width: 92%; max-width: 850px; margin: 40px auto; background-color: #FFFDE7; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; min-height: 300px; }
        .badge-pos { display: flex; justify-content: center; margin-top: -55px; margin-bottom: 25px; }
        .round-badge { background-color: #C2185B; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #F4F7F6; font-weight: bold; }
        .page-text-content { font-size: 20px; color: #5C2E00; line-height: 1.6; }
        .coming-soon-box { background-color: #C2185B; color: white; padding: 40px 20px; border-radius: 10px; width: 100%; }
        .bottom-nav { display: flex; justify-content: center; gap: 20px; padding-top: 25px; }
        .nav-btn { background-color: #C2185B; color: white; text-decoration: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; }
        .footer { background-color: #0D1B3D; color: white; text-align: center; padding: 30px; width: 100%; margin-top: auto; }
    </style>
</head>

<body>

<nav class="top-nav-container">
    <a href="/">Home</a>
    <a href="https://csrgnk.github.io/Omnnbc/">Main Site</a>
    <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
    <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok</a>
</nav>

<div class="site-title-box">
    <h1>Namo Narayanaya<br>Bhakthi Channel</h1>
</div>

<div class="page-nav-section">
    <div class="book-name-badge">Upasana Chandrika</div>
    <div class="scroll-controls">
        <button class="scroll-btn" onclick="sideScroll(-150)">&#10094;</button>
        <div class="numbers-wrapper" id="pagination"></div>
        <button class="scroll-btn" onclick="sideScroll(150)">&#10095;</button>
    </div>
</div>

<main class="main-content-card">
    <div class="badge-pos">
        <div class="round-badge" id="current-page">1</div>
    </div>
    <div id="content" class="page-text-content">Loading...</div>
    <div class="bottom-nav" id="bottom-nav"></div>
</main>

<footer class="footer">
    © 2026 Namo Narayanaya Bhakthi Channel | All Rights Reserved
</footer>

<script>
const totalPages = 143;
const paginationDiv = document.getElementById("pagination");
const contentDiv = document.getElementById("content");
const pageBadge = document.getElementById("current-page");
const btmNav = document.getElementById("bottom-nav");
const metaTitle = document.getElementById("meta-title");

// Get page from URL or default to 1
let urlParams = new URLSearchParams(window.location.search);
let page = parseInt(urlParams.get("page")) || 1;

function loadPage(p) {
    pageBadge.innerText = p;
    // Update Browser Title for SEO
    document.title = "Upasana Chandrika - Page " + p;
    
    fetch("pages/page" + p + ".html")
        .then(res => {
            if (!res.ok) throw new Error('404');
            return res.text();
        })
        .then(data => { 
            contentDiv.innerHTML = data; 
            updateButtons(); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
        })
        .catch(() => {
            contentDiv.innerHTML = `
                <div class="coming-soon-box">
                    <h2>Coming Soon</h2>
                    <p>This page is currently being prepared.<br>Please check back later.</p>
                </div>`;
            updateButtons();
        });
}

// Generate Pagination Links
for (let i = 1; i <= totalPages; i++) {
    const a = document.createElement("a");
    a.href = "?page=" + i;
    a.innerText = i;
    if (i === page) a.className = "active";
    paginationDiv.appendChild(a);
}

function sideScroll(d) { paginationDiv.scrollBy({ left: d, behavior: 'smooth' }); }

function updateButtons() {
    btmNav.innerHTML = `
        ${page > 1 ? `<a href="?page=${page-1}" class="nav-btn">Previous</a>` : ''}
        ${page < totalPages ? `<a href="?page=${page+1}" class="nav-btn">Next</a>` : ''}
    `;
}

document.addEventListener("DOMContentLoaded", () => {
    loadPage(page);
    setTimeout(() => {
        const active = document.querySelector(".active");
        if (active) active.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }, 500);
});
</script>

</body>
</html>
