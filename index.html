<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title id="meta-title">Upasana Chandrika - Namo Narayanaya</title>
    <meta name="description" content="Read Upasana Chandrika devotional content from Namo Narayanaya Bhakthi Channel.">
    <meta name="author" content="Sangameshwar">
    
    <link rel="icon" type="image/png" href="https://omnnbc.com/assets/images/Omnnbc-new.png">
    <link rel="apple-touch-icon" href="https://omnnbc.com/assets/images/Omnnbc-new.png">
    <link rel="canonical" href="https://upasana-chandrika.omnnbc.in/" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background-color: #F4F7F6;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        /* ===== 1. Top Navigation (Single Line Scrollable) ===== */
        .top-nav-container {
            background-color: #C2185B;
            width: 100%;
            padding: 12px 5px;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Firefox */
            justify-content: flex-start;
        }
        .top-nav-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .top-nav-container a {
            text-decoration: none;
            color: #C2185B;
            background-color: white;
            font-weight: bold;
            padding: 8px 18px;
            margin: 0 6px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ===== Header Section ===== */
        .header-container {
            background-color: #FFFDE7;
            padding: 20px 10px;
            border-bottom: 4px solid #FFD600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .header-logo { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #C2185B; }
        .site-title-main { color: #C2185B; font-size: 22px; text-align: left; line-height: 1.1; }

        /* ===== Pagination Bar ===== */
        .page-nav-section {
            width: 100%;
            background: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .book-name-badge {
            background-color: #C2185B;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .scroll-controls { display: flex; align-items: center; justify-content: center; width: 100%; }
        .numbers-wrapper { display: flex; overflow-x: auto; gap: 8px; padding: 10px; max-width: 75%; scrollbar-width: none; }
        .numbers-wrapper::-webkit-scrollbar { display: none; }
        .numbers-wrapper a { text-decoration: none; color: #C2185B; border: 1px solid #C2185B; padding: 8px 15px; border-radius: 4px; flex-shrink: 0; font-weight: bold; }
        .numbers-wrapper a.active { background-color: #C2185B; color: white; }
        .scroll-btn { background-color: #C2185B; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }

        /* ===== Main Content Card ===== */
        .main-content-card {
            width: 94%; 
            max-width: 850px; 
            margin: 40px auto;
            background-color: #FFFDE7;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            min-height: 400px;
        }
        .badge-pos { display: flex; justify-content: center; margin-top: -55px; margin-bottom: 25px; }
        .round-badge { background-color: #C2185B; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #F4F7F6; font-weight: bold; }

        /* Global Header Pink & Bold (Forces loaded pages to match) */
        .page-text-content { font-size: 20px; color: #3E2723; line-height: 1.8; width: 100%; }
        .page-text-content h1, .page-text-content h2, .page-text-content h3 { color: #C2185B !important; font-weight: bold !important; margin-bottom: 15px; }

        /* ===== BUTTON STYLE INDEX STYLES ===== */
        .idx-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .idx-button {
            display: flex; align-items: center; text-decoration: none;
            background: white; border-radius: 8px; overflow: hidden;
            border: 1px solid #FFD600; transition: 0.3s;
        }
        .idx-button:hover { transform: scale(1.01); box-shadow: 0 4px 10px rgba(194, 24, 91, 0.2); }
        .idx-page-num {
            background-color: #C2185B; color: white; padding: 15px;
            font-weight: bold; min-width: 55px; text-align: center; font-size: 18px;
        }
        .idx-topic-name { padding: 15px; color: #C2185B; font-weight: bold; flex-grow: 1; text-align: left; font-size: 18px; }

        .bottom-nav { display: flex; justify-content: center; gap: 20px; padding-top: 25px; }
        .nav-btn { background-color: #C2185B; color: white; text-decoration: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; }
        .footer { background-color: #0D1B3D; color: white; text-align: center; padding: 30px; width: 100%; margin-top: auto; }
    </style>
</head>

<body>

<nav class="top-nav-container">
    <a href="/">Home</a>
    <a href="https://omnnbc.com">Main Site</a>
    <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
    <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok</a>
</nav>

<header class="header-container">
    <img src="https://omnnbc.com/assets/images/Omnnbc-new.png" class="header-logo" alt="Logo">
    <h1 class="site-title-main">
        <span style="font-weight:bold;">Namo Narayanaya</span><br>
        <span style="font-size:18px; font-weight:normal;">Bhakthi Channel</span>
    </h1>
</header>

<div class="page-nav-section">
    <div class="book-name-badge">శ్రీ ఉపాసన చంద్రిక</div>
    <div class="scroll-controls">
        <button class="scroll-btn" onclick="sideScroll(-150)">&#10094;</button>
        <div class="numbers-wrapper" id="pagination"></div>
        <button class="scroll-btn" onclick="sideScroll(150)">&#10095;</button>
    </div>
</div>

<main class="main-content-card">
    <div class="badge-pos">
        <div class="round-badge" id="current-badge">M</div>
    </div>
    <div id="content" class="page-text-content">Loading...</div>
    <div class="bottom-nav" id="bottom-nav"></div>
</main>

<footer class="footer">
    © 2026 Namo Narayanaya Bhakthi Channel | All Rights Reserved
</footer>

<script>
const totalPages = 143;
const paginationDiv = document.getElementById("pagination");
const contentDiv = document.getElementById("content");
const badge = document.getElementById("current-badge");
const btmNav = document.getElementById("bottom-nav");

const buttonIndexHTML = `
    <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="color:#C2185B; font-weight:bold;">జై గురుదేవ్</h2>
        <h1 style="color:#C2185B; font-weight:bold; font-size:30px; border-bottom: 3px solid #FFD600; display: inline-block; padding-bottom: 8px;">శ్రీ ఉపాసన చంద్రిక</h1>
        <h3 style="color:#C2185B; font-weight:bold; margin-top:10px;">విషయ సూచిక (Main Menu)</h3>
    </div>
    <div class="idx-grid">
        <a href="?page=1" class="idx-button"><div class="idx-page-num">1</div><div class="idx-topic-name">ప్రాతః స్మరణ సంస్కృత శ్లోకములు</div></a>
        <a href="?page=9" class="idx-button"><div class="idx-page-num">9</div><div class="idx-topic-name">భూపాలీ</div></a>
        <a href="?page=21" class="idx-button"><div class="idx-page-num">21</div><div class="idx-topic-name">ఊర్వశీ (సజ్జన్‌గఢ్ చరణాల్లో ప్రవహించినది)</div></a>
        <a href="?page=21" class="idx-button"><div class="idx-page-num">21</div><div class="idx-topic-name">కాకడారతీ</div></a>
        <a href="?page=24" class="idx-button"><div class="idx-page-num">24</div><div class="idx-topic-name">పూజా విధానము</div></a>
        <a href="?page=26" class="idx-button"><div class="idx-page-num">26</div><div class="idx-topic-name">శ్రీ సద్గురు స్తవనము</div></a>
        <a href="?page=31" class="idx-button"><div class="idx-page-num">31</div><div class="idx-topic-name">ఆరతీలు</div></a>
        <a href="?page=33" class="idx-button"><div class="idx-page-num">33</div><div class="idx-topic-name">శ్రీ గురుపరంపరా</div></a>
        <a href="?page=34" class="idx-button"><div class="idx-page-num">34</div><div class="idx-topic-name">మానసపూజ</div></a>
        <a href="?page=39" class="idx-button"><div class="idx-page-num">39</div><div class="idx-topic-name">శ్రీ గోవింద్ మహారాజ్ గారి ఆరతీ</div></a>
        <a href="?page=41" class="idx-button"><div class="idx-page-num">41</div><div class="idx-topic-name">భిక్ష</div></a>
        <a href="?page=43" class="idx-button"><div class="idx-page-num">43</div><div class="idx-topic-name">ఛబిన</div></a>
        <a href="?page=52" class="idx-button"><div class="idx-page-num">52</div><div class="idx-topic-name">భీమరూపి స్తోత్రం</div></a>
        <a href="?page=69" class="idx-button"><div class="idx-page-num">69</div><div class="idx-topic-name">శ్రీరామ రక్షా స్తోత్రం</div></a>
        <a href="?page=74" class="idx-button"><div class="idx-page-num">74</div><div class="idx-topic-name">హనుమాన్ చాలీసా</div></a>
        <a href="?page=78" class="idx-button"><div class="idx-page-num">78</div><div class="idx-topic-name">శ్రీరామదాస చక్రీ భజన</div></a>
        <a href="?page=86" class="idx-button"><div class="idx-page-num">86</div><div class="idx-topic-name">కరుణాష్టకాలు</div></a>
        <a href="?page=103" class="idx-button"><div class="idx-page-num">103</div><div class="idx-topic-name">వారముల అష్టకము</div></a>
        <a href="?page=114" class="idx-button"><div class="idx-page-num">114</div><div class="idx-topic-name">సవాయిలు</div></a>
        <a href="?page=129" class="idx-button"><div class="idx-page-num">129</div><div class="idx-topic-name">దాసబోధ వచనము</div></a>
        <a href="?page=135" class="idx-button"><div class="idx-page-num">135</div><div class="idx-topic-name">షేజారతి</div></a>
        <a href="?page=143" class="idx-button"><div class="idx-page-num">143</div><div class="idx-topic-name">రామదాసి ఎప్పుడు అనాలి</div></a>
    </div>
`;

let urlParams = new URLSearchParams(window.location.search);
let page = urlParams.get("page");

function loadPage(p) {
    if (p === null || p === "0") {
        contentDiv.innerHTML = buttonIndexHTML;
        badge.innerText = "M";
        document.title = "Upasana Chandrika - Main Page";
        updateNav(0);
    } else {
        const pNum = parseInt(p);
        badge.innerText = pNum;
        document.title = "Page " + pNum + " | Upasana Chandrika";
        fetch("pages/page" + pNum + ".html")
            .then(res => res.text())
            .then(data => { contentDiv.innerHTML = data; updateNav(pNum); window.scrollTo(0,0); })
            .catch(() => { contentDiv.innerHTML = "<p>Content coming soon...</p>"; updateNav(pNum); });
    }
}

// Build Horizontal Pagination Bar
const mainBtn = document.createElement("a");
mainBtn.href = window.location.pathname;
mainBtn.innerText = "Main Page";
if (!page) mainBtn.className = "active";
paginationDiv.appendChild(mainBtn);

for (let i = 1; i <= totalPages; i++) {
    const a = document.createElement("a");
    a.href = "?page=" + i;
    a.innerText = i;
    if (page === i.toString()) a.className = "active";
    paginationDiv.appendChild(a);
}

function updateNav(curr) {
    btmNav.innerHTML = `
        ${curr > 0 ? `<a href="${curr === 1 ? window.location.pathname : '?page=' + (curr - 1)}" class="nav-btn">Previous</a>` : ''}
        ${curr < totalPages ? `<a href="?page=${curr + 1}" class="nav-btn">Next</a>` : ''}
    `;
}

function sideScroll(d) { paginationDiv.scrollBy({ left: d, behavior: 'smooth' }); }

document.addEventListener("DOMContentLoaded", () => {
    loadPage(page);
    setTimeout(() => {
        const act = document.querySelector(".active");
        if (act) act.scrollIntoView({ behavior: "smooth", inline: "center" });
    }, 500);
});
</script>
</body>
</html>
