<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title id="meta-title">Upasana Chandrika - Namo Narayanaya</title>
    <meta name="description" content="Read Upasana Chandrika devotional content, chapters, and stotrams from Namo Narayanaya Bhakthi Channel.">
    <meta name="author" content="Sangameshwar">
    
    <link rel="icon" type="image/png" href="https://omnnbc.com/assets/images/Omnnbc-new.png">
    <link rel="apple-touch-icon" href="https://omnnbc.com/assets/images/Omnnbc-new.png">

    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="canonical" href="https://upasana-chandrika.omnnbc.in/" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background-color: #F4F7F6;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        /* ===== Top Navigation ===== */
        .top-nav-container {
            background-color: #C2185B;
            width: 100%;
            padding: 12px 0;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            justify-content: flex-start;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .top-nav-container::-webkit-scrollbar { display: none; }

        .top-nav-container a {
            display: inline-block;
            text-decoration: none;
            color: #C2185B;
            background-color: white;
            font-weight: bold;
            padding: 8px 18px;
            margin: 0 6px;
            border-radius: 5px;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* ===== Logo & Header Section ===== */
        .header-container {
            background-color: #FFFDE7;
            padding: 20px 10px;
            border-bottom: 4px solid #FFD600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header-logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid #C2185B; }
        .site-title-wrapper { text-align: left; }
        .site-title-main { color: #C2185B; font-size: 22px; margin: 0; line-height: 1.1; display: flex; flex-direction: column; }
        .line-1 { font-weight: bold; }
        .line-2 { font-size: 18px; font-weight: normal; }

        /* ===== Pagination Section ===== */
        .page-nav-section {
            width: 100%;
            background: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .book-name-badge {
            background-color: #C2185B;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            margin-bottom: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .scroll-controls { display: flex; align-items: center; justify-content: center; width: 100%; }
        .numbers-wrapper { display: flex; overflow-x: auto; gap: 8px; padding: 10px; max-width: 70%; scrollbar-width: none; }
        .numbers-wrapper::-webkit-scrollbar { display: none; }
        .numbers-wrapper a { text-decoration: none; color: #C2185B; border: 1px solid #C2185B; padding: 8px 15px; border-radius: 4px; flex-shrink: 0; font-weight: bold; }
        .numbers-wrapper a.active { background-color: #C2185B; color: white; }
        .scroll-btn { background-color: #C2185B; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* ===== MAIN CONTENT CARD ===== */
        .main-content-card {
            width: 92%; 
            max-width: 850px; 
            margin: 40px auto;
            background-color: #FFFDE7;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            min-height: 300px;
        }

        .badge-pos { display: flex; justify-content: center; margin-top: -55px; margin-bottom: 25px; }
        .round-badge { background-color: #C2185B; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #F4F7F6; font-weight: bold; }

        .page-text-content { font-size: 20px; color: #5C2E00; line-height: 1.7; word-wrap: break-word; width: 100%; }

        /* Force Pink Headings in loaded content */
        .page-text-content h1, .page-text-content h2, .page-text-content h3 { color: #C2185B !important; font-weight: bold !important; margin-bottom: 15px; }

        /* Index Specific Styling */
        .idx-h1-line { color: #C2185B; font-size: 28px; border-bottom: 3px solid #FFD600; display: inline-block; padding-bottom: 5px; font-weight: bold; margin: 10px 0; }
        .index-table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 20px; }
        .index-table td { padding: 14px 5px; border-bottom: 1px dashed #C2185B; }
        .page-col { width: 45px; font-weight: bold; color: #C2185B; font-size: 18px; }
        .topic-col a { text-decoration: none; color: #C2185B; display: block; font-size: 19px; font-weight: bold; transition: 0.2s; }
        .topic-col a:hover { color: #5C2E00; padding-left: 5px; }
        .sub-info { font-size: 14px; color: #666; display: block; font-weight: normal; }

        .bottom-nav { display: flex; justify-content: center; gap: 20px; padding-top: 25px; }
        .nav-btn { background-color: #C2185B; color: white; text-decoration: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; }

        .footer { background-color: #0D1B3D; color: white; text-align: center; padding: 30px; width: 100%; margin-top: auto; }
    </style>
</head>

<body>

<nav class="top-nav-container">
    <a href="/">Home</a>
    <a href="https://omnnbc.com">Main Site</a>
</nav>

<header class="header-container">
    <img src="https://omnnbc.com/assets/images/Omnnbc-new.png" class="header-logo" alt="Namo Narayanaya Logo">
    <div class="site-title-wrapper">
        <h1 class="site-title-main">
            <span class="line-1">Namo Narayanaya</span>
            <span class="line-2" style="font-size: 18px; font-weight: normal;">Bhakthi Channel</span>
        </h1>
    </div>
</header>

<div class="page-nav-section">
    <div class="book-name-badge">Upasana Chandrika</div>
    <div class="scroll-controls">
        <button class="scroll-btn" onclick="sideScroll(-150)">&#10094;</button>
        <div class="numbers-wrapper" id="pagination"></div>
        <button class="scroll-btn" onclick="sideScroll(150)">&#10095;</button>
    </div>
</div>

<main class="main-content-card">
    <div class="badge-pos">
        <div class="round-badge" id="current-page">I</div>
    </div>
    <div id="content" class="page-text-content">Loading...</div>
    <div class="bottom-nav" id="bottom-nav"></div>
</main>

<footer class="footer">
    © 2026 Namo Narayanaya Bhakthi Channel | All Rights Reserved
</footer>

<script>
const totalPages = 143;
const paginationDiv = document.getElementById("pagination");
const contentDiv = document.getElementById("content");
const pageBadge = document.getElementById("current-page");
const btmNav = document.getElementById("bottom-nav");

const pinkIndexHTML = `
    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color:#C2185B; font-weight:bold;">జై గురుదేవ్</h2>
        <h1 class="idx-h1-line">శ్రీ ఉపాసన చంద్రిక</h1>
        <h3 style="color:#C2185B; font-weight:bold; margin-top:10px;">విషయ సూచిక</h3>
    </div>
    <table class="index-table">
        <tr><td class="page-col">1</td><td class="topic-col"><a href="?page=1">ప్రాతః స్మరణ సంస్కృత శ్లోకములు</a></td></tr>
        <tr><td class="page-col">9</td><td class="topic-col"><a href="?page=9">భూపాలీ</a></td></tr>
        <tr><td class="page-col">21</td><td class="topic-col"><a href="?page=21">ఊర్వశీ <span class="sub-info">(సజ్జన్‌గఢ్ చరణాల్లో ప్రవహించినది)</span></a></td></tr>
        <tr><td class="page-col">21</td><td class="topic-col"><a href="?page=21">కాకడారతీ</a></td></tr>
        <tr><td class="page-col">24</td><td class="topic-col"><a href="?page=24">పూజా విధానము</a></td></tr>
        <tr><td class="page-col">26</td><td class="topic-col"><a href="?page=26">శ్రీ సద్గురు స్తవనము</a></td></tr>
        <tr><td class="page-col">31</td><td class="topic-col"><a href="?page=31">ఆరతీలు</a></td></tr>
        <tr><td class="page-col">33</td><td class="topic-col"><a href="?page=33">శ్రీ గురుపరంపరా</a></td></tr>
        <tr><td class="page-col">34</td><td class="topic-col"><a href="?page=34">మానసపూజ</a></td></tr>
        <tr><td class="page-col">39</td><td class="topic-col"><a href="?page=39">శ్రీ గోవింద్ మహారాజ్ గారి ఆరతీ</a></td></tr>
        <tr><td class="page-col">41</td><td class="topic-col"><a href="?page=41">భిక్ష</a></td></tr>
        <tr><td class="page-col">43</td><td class="topic-col"><a href="?page=43">ఛబిన</a></td></tr>
        <tr><td class="page-col">53</td><td class="topic-col"><a href="?page=53">భీమరూపి స్తోత్రం</a></td></tr>
        <tr><td class="page-col">69</td><td class="topic-col"><a href="?page=69">శ్రీరామ రక్షా స్తోత్రం</a></td></tr>
        <tr><td class="page-col">74</td><td class="topic-col"><a href="?page=74">హనుమాన్ చాలీసా</a></td></tr>
        <tr><td class="page-col">78</td><td class="topic-col"><a href="?page=78">శ్రీరామదాస చక్రీ భజన</a></td></tr>
        <tr><td class="page-col">86</td><td class="topic-col"><a href="?page=86">కరుణాష్టకాలు</a></td></tr>
        <tr><td class="page-col">103</td><td class="topic-col"><a href="?page=103">వారముల అష్టకము</a></td></tr>
        <tr><td class="page-col">114</td><td class="topic-col"><a href="?page=114">సవాయిలు</a></td></tr>
        <tr><td class="page-col">129</td><td class="topic-col"><a href="?page=129">దాసబోధ వచనము</a></td></tr>
        <tr><td class="page-col">135</td><td class="topic-col"><a href="?page=135">షేజారతి</a></td></tr>
        <tr><td class="page-col">143</td><td class="topic-col"><a href="?page=143">రామదాసి ఎప్పుడు అనాలి</a></td></tr>
    </table>
`;

let urlParams = new URLSearchParams(window.location.search);
let page = urlParams.get("page");

function loadPage(p) {
    if (p === null || p === "0") {
        contentDiv.innerHTML = pinkIndexHTML;
        pageBadge.innerText = "I";
        document.title = "Upasana Chandrika - Index";
        updateButtons(0);
    } else {
        const pageNum = parseInt(p);
        pageBadge.innerText = pageNum;
        document.title = "Page " + pageNum + " | Upasana Chandrika";
        fetch("pages/page" + pageNum + ".html")
            .then(res => res.text())
            .then(data => { contentDiv.innerHTML = data; updateButtons(pageNum); window.scrollTo(0,0); })
            .catch(() => { contentDiv.innerHTML = "Content loading..."; updateButtons(pageNum); });
    }
}

// Build Pagination Bar (Starts from 1, Home button leads to pure URL)
const homeBtn = document.createElement("a");
homeBtn.href = window.location.pathname; // Pure URL
homeBtn.innerText = "Index";
if (page === null || page === "0") homeBtn.className = "active";
paginationDiv.appendChild(homeBtn);

for (let i = 1; i <= totalPages; i++) {
    const a = document.createElement("a");
    a.href = "?page=" + i;
    a.innerText = i;
    if (page === i.toString()) a.className = "active";
    paginationDiv.appendChild(a);
}

function updateButtons(curr) {
    btmNav.innerHTML = `
        ${curr > 0 ? `<a href="${curr === 1 ? window.location.pathname : '?page=' + (curr - 1)}" class="nav-btn">Previous</a>` : ''}
        ${curr < totalPages ? `<a href="?page=${curr + 1}" class="nav-btn">Next</a>` : ''}
    `;
}

function sideScroll(d) { paginationDiv.scrollBy({ left: d, behavior: 'smooth' }); }

document.addEventListener("DOMContentLoaded", () => {
    loadPage(page);
    setTimeout(() => {
        const active = document.querySelector(".active");
        if (active) active.scrollIntoView({ behavior: "smooth", inline: "center" });
    }, 500);
});
</script>
</body>
</html>
